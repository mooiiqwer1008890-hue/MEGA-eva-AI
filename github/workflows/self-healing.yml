name: Self-Healing Bot

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ═══════════════════════════════════════════════════════
  # 1. فحص الصحة الأساسي
  # ═══════════════════════════════════════════════════════
  health-check:
    name: "🏥 فحص صحة المشروع"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax Check (All Python files)
        run: |
          echo "🔍 فحص النحو لكل ملفات Python..."
          for file in *.py; do
            if [ -f "$file" ]; then
              python -m py_compile "$file" || echo "❌ فشل: $file"
            fi
          done

      - name: Import Check (Critical Files)
        run: |
          echo "🔍 فحص الاستيراد..."
          python -c "import numpy, pandas, requests" || exit 1

  # ═══════════════════════════════════════════════════════
  # 2. فحص الكود باستخدام Ruff
  # ═══════════════════════════════════════════════════════
  lint:
    name: "🧹 فحص الكود (Lint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: |
          echo "🧹 فحص الكود..."
          ruff check . --output-format=github || true

  # ═══════════════════════════════════════════════════════
  # 3. فحص الأمان باستخدام Bandit
  # ═══════════════════════════════════════════════════════
  security:
    name: "🔒 فحص الأمان"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          echo "🔒 فحص الأمان..."
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt || true

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ═══════════════════════════════════════════════════════
  # 4. اختبار الوحدة (إذا وجدت ملفات اختبار)
  # ═══════════════════════════════════════════════════════
  tests:
    name: "🧪 اختبار الوحدة"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          if [ -d "tests" ] || ls test_*.py 2>/dev/null; then
            pytest -v --tb=short
          else
            echo "ℹ️ لا توجد اختبارات — تخطي"
          fi

  # ═══════════════════════════════════════════════════════
  # 5. مراجعة تلقائية بـ CodeRabbit
  # ═══════════════════════════════════════════════════════
  coderabbit-review:
    name: "🐰 مراجعة CodeRabbit"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeRabbit Review
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          debug: false
          review_simple_changes: true
          review_comment_lgtm: false

  # ═══════════════════════════════════════════════════════
  # 6. إشعار بالحالة النهائية
  # ═══════════════════════════════════════════════════════
  notify:
    name: "📢 إشعار الحالة"
    runs-on: ubuntu-latest
    needs: [health-check, lint]
    if: always()
    steps:
      - name: Status Summary
        run: |
          echo "════════════════════════════════════════"
          echo "📊 ملخص الفحص"
          echo "════════════════════════════════════════"
          echo "Health Check: ${{ needs.health-check.result }}"
          echo "Lint Check:   ${{ needs.lint.result }}"
          echo "════════════════════════════════════════"
